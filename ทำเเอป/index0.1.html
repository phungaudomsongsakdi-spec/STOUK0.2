<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>ระบบบริหารสต็อกเครื่องแบบพนักงาน</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <style>
        * {
            font-family: 'Kanit', sans-serif;
        }
        
        :root {
            --theme-yellow: #086fff;
            --theme-gold: #3780d4;
            --theme-brown: #2b598b;
            --theme-dark-brown: #1a2f5c;
            --theme-cream: #e7f9ff;
            --theme-white: #ffffff;
            --theme-soft: #c7f0fe;
        }
        
        body {
            background: linear-gradient(135deg, #ffffff 0%, #ffffff 100%);
            min-height: 100vh;
        }
        
        /* Sidebar Drawer */
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            width: 300px;
            background: linear-gradient(180deg, var(--theme-cream) 0%, #e7f4ff 100%);
            z-index: 2000;
            transform: translateX(-100%);
            transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            box-shadow: 4px 0 30px rgba(0, 0, 0, 0.15);
            display: flex;
            flex-direction: column;
            border-radius: 0 24px 24px 0;
        }
        
        .sidebar.open {
            transform: translateX(0);
        }
        
        .drawer-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1999;
            opacity: 0;
            visibility: hidden;
            transition: 0.25s ease;
            backdrop-filter: blur(4px);
        }
        
        .drawer-backdrop.open {
            opacity: 1;
            visibility: visible;
        }
        
        .sidebar-header {
            padding: 28px 20px 20px;
            border-bottom: 2px solid var(--theme-gold);
            background: linear-gradient(135deg, #ffffff 100%);
            border-radius: 0 0 30px 30px;
            color: white;
        }
        
        .logo-drawer {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .logo-icon-drawer {
            background: rgba(255, 255, 255, 0.2);
            width: 55px;
            height: 55px;
            border-radius: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            color: var(--theme-gold);
        }
        
        .close-drawer {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .close-drawer:hover {
            background: var(--theme-gold);
            color: var(--theme-brown);
            transform: rotate(90deg);
        }
        
        .menu-list {
            flex: 1;
            padding: 20px 12px;
        }
        
        .menu-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 14px 20px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 1rem;
            color: var(--theme-brown);
            transition: all 0.25s ease;
            cursor: pointer;
            margin-bottom: 8px;
        }
        
        .menu-item i {
            width: 28px;
            font-size: 1.25rem;
            text-align: center;
        }
        
        .menu-item:hover {
            background: #c7f0fe;
            transform: translateX(8px);
        }
        
        .menu-item.active {
            background: linear-gradient(135deg,  #ffffff 100%);
            color: var(--theme-gold);
            box-shadow: 0 4px 12px rgba(139, 90, 43, 0.3);
        }
        
        /* Top Bar */
        .top-bar {
            background: var(--theme-white);
            border-radius: 24px;
            padding: 20px 24px;
            margin-bottom: 25px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            border: 1px solid var(--theme-yellow);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .menu-btn {
            background:white;
            border: none;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--theme-brown);
            transition: all 0.2s;
        }
        
        .menu-btn:hover {
            background: var(--theme-gold);
            color: white;
            transform: scale(1.05);
        }
        
        .stock-title {
            text-align: center;
            flex: 1;
        }
        
        .stock-title .line1 {
            font-size: 2rem;
            font-weight: 800;
            color: var(--theme-brown);
            letter-spacing: 2px;
        }
        
        .stock-title .line1 i {
            color: var(--theme-gold);
            margin-right: 10px;
            font-size: 1.8rem;
        }
        
        .stock-title .line2 {
            font-size: 1.2rem;
            font-weight: 500;
            color: var(--theme-brown);
            opacity: 0.7;
            letter-spacing: 3px;
            margin-top: -5px;
        }
        
        /* Stats Cards */
        .stats-container {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }
        
        .stat-card-gold {
            background: linear-gradient(135deg, #ffffff 0%, #ffffff 100%);
            border-radius: 24px;
            padding: 20px 30px;
            text-align: center;
            flex: 1;
            min-width: 140px;
            box-shadow: 0 8px 20px rgba(240, 240, 240, 0.25);
            transition: all 0.3s ease;
            border-bottom: 4px solid var(--theme-gold);
        }  
        .stat-card-gold .stat-icon {
            font-size: 2.5rem;
            color: rgb(45, 150, 203);
            margin-bottom: 10px;
        }
        
        .stat-card-gold .stat-number {
            font-size: 2rem;
            font-weight: 800;
            color: rgb(113, 177, 213);
        }
        
        .stat-card-gold .stat-label {
            font-size: 0.85rem;
            color: rgba(126, 191, 255, 0.9);
            font-weight: 500;
        }
        
        .stat-card-gold .stat-icon-green {
            color: #4CAF50;
        }
        .stat-card-gold .stat-number-green {
            color: #4CAF50;
        }
        .stat-card-gold .stat-icon-red {
            color: #F44336;
        }
        .stat-card-gold .stat-number-red {
            color: #F44336;
        }
        
        /* Cards */
        .card-custom {
            background: var(--theme-white);
            border-radius: 24px;
            border: none;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            transition: all 0.3s ease;
            overflow: hidden;
            margin-bottom: 25px;
        }
         
        .card-header-custom {
            background: linear-gradient(135deg, var(--theme-brown) 0%, #35adff 100%);
            color: var(--theme-gold);
            padding: 18px 24px;
            border-bottom: none;
        }
        
        .card-header-custom h3 {
            margin: 0;
            font-size: 1.3rem;
            font-weight: 600;
            color: white;
        }
        
        .card-header-custom i {
            margin-right: 10px;
        }
        
        .card-body-custom {
            padding: 24px;
        }
        
        /* ===== ตารางที่ปรับให้สวยบนมือถือ ===== */
        .table-wrapper {
            overflow-x: auto;
            overflow-y: visible;
            -webkit-overflow-scrolling: touch;
            border-radius: 20px;
            margin: 0 -5px;
            padding: 0 5px;
        }
        
        .table-custom {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            font-size: 0.8rem;
            min-width: 700px;
            background: white;
            border-radius: 20px;
        }
        
        .table-custom th {
            background: linear-gradient(135deg, #e8f4fd 0%, #d4eafa 100%);
            color: var(--theme-brown);
            font-weight: 700;
            padding: 14px 10px;
            font-size: 0.8rem;
            white-space: nowrap;
            position: sticky;
            top: 0;
        }
        
        .table-custom td {
            padding: 12px 10px;
            border-bottom: 1px solid #eef2fa;
            vertical-align: middle;
            background: white;
        }
        
        .table-custom tr:hover td {
            background: #f5fafe;
        }
        
        /* คอลัมน์แรก (ลำดับที่) */
        .table-custom th:first-child,
        .table-custom td:first-child {
            padding-left: 15px;
        }
        
        .table-custom th:last-child,
        .table-custom td:last-child {
            padding-right: 15px;
        }
        
        /* Badges */
        .badge-low {
            background: #fef3c7;
            color: #b45309;
            padding: 5px 12px;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 600;
            white-space: nowrap;
        }
        
        .badge-normal {
            background: #dcfce7;
            color: #166534;
            padding: 5px 12px;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 600;
            white-space: nowrap;
        }
        
        /* รีไทม์ปุ่ม */
        .reorder-val {
            cursor: pointer;
            background: #eef2fa;
            padding: 6px 14px;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 600;
            display: inline-block;
            white-space: nowrap;
            transition: all 0.2s;
        }
        
        .reorder-val:hover {
            background: #dce6f0;
            transform: scale(1.02);
        }
        
        /* ปุ่มจัดการ */
        .edit-stock {
            cursor: pointer;
            font-size: 1.2rem;
            color: var(--theme-brown);
            padding: 8px;
            border-radius: 50%;
            transition: all 0.2s;
            display: inline-block;
        }
        
        .edit-stock:hover {
            background: #e8f0fe;
            transform: scale(1.1);
        }
        
        /* ช่องค้นหา */
        .search-box {
            background: #f0f4fa;
            border-radius: 40px;
            padding: 8px 18px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .search-box input {
            border: none;
            background: transparent;
            outline: none;
            width: 200px;
            font-size: 0.85rem;
        }
        
        .search-box input::placeholder {
            color: #9aaebf;
        }
        
        /* Form */
        .btn-primary-custom {
            background: linear-gradient(135deg, #ffffff 100%);
            border: none;
            padding: 12px 28px;
            border-radius: 40px;
            font-weight: 600;
            transition: all 0.3s;
            color: white;
        }
        
        .btn-success-custom {
            background: linear-gradient(135deg, var(--theme-gold) 0%, var(--theme-yellow) 100%);
            border: none;
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: 600;
            color: var(--theme-brown);
        }
        
        .filter-bar {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 20px;
            align-items: center;
        }
        
        /* Responsive - มือถือ */
        @media (max-width: 768px) {
            .stock-title .line1 { font-size: 1.5rem; }
            .stock-title .line2 { font-size: 1rem; }
            .stat-card-gold .stat-number { font-size: 1.3rem; }
            .stat-card-gold { padding: 12px 20px; min-width: 100px; }
            .search-box input { width: 130px; }
            .top-bar { padding: 12px 16px; }
            .card-header-custom { padding: 14px 18px; }
            .card-header-custom h3 { font-size: 1.1rem; }
            .card-body-custom { padding: 16px; }
            .table-custom { font-size: 0.7rem; min-width: 650px; }
            .table-custom th, .table-custom td { padding: 10px 6px; }
            .badge-low, .badge-normal { padding: 3px 8px; font-size: 0.65rem; }
            .reorder-val { padding: 4px 10px; font-size: 0.65rem; }
            .edit-stock { font-size: 1rem; padding: 6px; }
        }
        
        @media (max-width: 480px) {
            .stats-container { gap: 10px; }
            .stat-card-gold { padding: 8px 12px; min-width: 85px; }
            .stat-card-gold .stat-icon { font-size: 1.5rem; }
            .stat-card-gold .stat-number { font-size: 1rem; }
            .stat-card-gold .stat-label { font-size: 0.65rem; }
            .table-custom { min-width: 580px; font-size: 0.65rem; }
        }
        
        .dropdown-list {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border-radius: 16px;
            max-height: 250px;
            overflow-y: auto;
            z-index: 300;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            border: 1px solid #e2e8f0;
        }
        
        .dropdown-item {
            padding: 12px 16px;
            cursor: pointer;
            border-bottom: 1px solid #f0f4fa;
            transition: background 0.1s;
        }
        
        .dropdown-item:hover {
            background: var(--theme-soft);
        }
        
        .relative {
            position: relative;
        }
        
        .footer {
            text-align: center;
            padding: 20px;
            font-size: 0.8rem;
            color: #8b7355;
        }
    </style>
</head>
<body>

<!-- Drawer Backdrop -->
<div class="drawer-backdrop" id="drawerBackdrop"></div>

<!-- Sidebar -->
<div class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <div class="d-flex justify-content-between align-items-center">
            <div class="logo-drawer">
                <div class="logo-icon-drawer">
                    <i class="fas fa-tshirt"></i>
                </div>
                <div>
                    <h5 class="mb-0" style="color: var(--theme-gold);">คลังเครื่องแบบ</h5>
                    <small style="color: rgba(6, 65, 136, 0.8);">ระบบบริหารสต็อก</small>
                </div>
            </div>
            <button class="close-drawer" id="closeDrawerBtn">
                <i class="fas fa-times"></i>
            </button>
        </div>
    </div>
    <div class="menu-list">
        <div class="menu-item" data-page="stock">
            <i class="fas fa-boxes"></i> คลังสินค้า
        </div>
        <div class="menu-item" data-page="movement">
            <i class="fas fa-hand-holding-heart"></i> เบิก/แจกพนักงาน
        </div>
        <div class="menu-item" data-page="return">
            <i class="fas fa-undo-alt"></i> คืน/เปลี่ยนสินค้า
        </div>
        <div class="menu-item" data-page="receive">
            <i class="fas fa-truck-ramp-box"></i> รับสินค้าเข้า
        </div>
        <div class="menu-item" data-page="reports">
            <i class="fas fa-chart-line"></i> รายงานรายเดือน
        </div>
    </div>
    <div class="p-3 text-center border-top" style="font-size: 0.7rem; color: #a08a6c;">
        <i class="fas fa-database"></i> บันทึกอัตโนมัติ
    </div>
</div>

<!-- Main Content -->
<div class="container py-3">
    <div class="top-bar">
        <button class="menu-btn" id="menuToggleBtn">
            <i class="fas fa-bars"></i>
        </button>
        <div class="stock-title">
            <div class="line1">
                <i class="fas fa-tshirt"></i> สต๊อก
            </div>
            <div class="line2">
                ยูนิฟอร์ม
            </div>
        </div>
        <div style="width: 48px;"></div>
    </div>
    
    <div class="stats-container">
        <div class="stat-card-gold">
            <div class="stat-icon"><i class="fas fa-tshirt"></i></div>
            <div class="stat-number" id="totalItemsStat">28</div>
            <div class="stat-label">รายการสินค้า</div>
        </div>
        <div class="stat-card-gold">
            <div class="stat-icon stat-icon-green"><i class="fas fa-check-circle"></i></div>
            <div class="stat-number stat-number-green" id="normalStockStat">27</div>
            <div class="stat-label">สถานะปกติ</div>
        </div>
        <div class="stat-card-gold">
            <div class="stat-icon stat-icon-red"><i class="fas fa-exclamation-triangle"></i></div>
            <div class="stat-number stat-number-red" id="lowStockStat">1</div>
            <div class="stat-label">รีไทม์ควรสั่งซื้อ</div>
        </div>
    </div>
    
    <div id="pageContainer"></div>
    
    <div class="footer">
        <i class="fas fa-sync-alt"></i> ระบบบริหารสต็อกเครื่องแบบ
    </div>
</div>

<script>
    const productBase = [
        ["60700005","GROUND CLOTHS(เสื้อกราวด์แขนสั้น)","SET",""],
        ["60700052","Hat (หมวกตาข่าย) (ขาว)","EA",150],
        ["60700055","Hat (หมวกตาข่าย) (ชมพู)","EA",150],
        ["60700054","Hat (หมวกตาข่าย) (เหลือง)","EA",150],
        ["60700053","Hat (หมวกตาข่าย) (แดง)","EA",150],
        ["60700048","Hat (หมวกมีหู) (ขาว)","EA",150],
        ["60700051","Hat (หมวกมีหู) (ฟ้า)","EA",150],
        ["60700050","Hat (หมวกมีหู) (เหลือง)","EA",150],
        ["60700049","Hat (หมวกมีหู) (แดง)","EA",150],
        ["60700039","กางเกง (Size : 26)","EA",245],
        ["60700040","กางเกง (Size : 28)","EA",245],
        ["60700041","กางเกง (Size : 30)","EA",245],
        ["60700042","กางเกง (Size : 32)","EA",245],
        ["60700043","กางเกง (Size : 34)","EA",245],
        ["60700044","กางเกง (Size : 36)","EA",245],
        ["60700045","กางเกง (Size : 38)","EA",245],
        ["60700046","กางเกง (Size : 40)","EA",245],
        ["60700056","รองเท้า (Size 36)","PR",115],
        ["60700057","รองเท้า (37)","PR",115],
        ["60700058","รองเท้า (38)","PR",115],
        ["60700059","รองเท้า (39)","PR",115],
        ["60700060","รองเท้า (40)","PR",115],
        ["60700061","รองเท้า (41)","PR",115],
        ["60700016","เสื้อShop L","EA",195],
        ["60700015","เสื้อShop M","EA",195],
        ["60700014","เสื้อShop S","EA",195],
        ["60700017","เสื้อShop XL","EA",195],
        ["60700018","เสื้อShop XXL","EA",195]
    ];
    
    let AppStore = {
        products: [], movements: [], returns: [], receives: [],
        load() {
            let p = localStorage.getItem("uniform_products_v9"); if(p) this.products = JSON.parse(p); else this.initProducts();
            let m = localStorage.getItem("uniform_movements_v9"); if(m) this.movements = JSON.parse(m); else this.movements = [];
            let r = localStorage.getItem("uniform_returns_v9"); if(r) this.returns = JSON.parse(r); else this.returns = [];
            let rc = localStorage.getItem("uniform_receives_v9"); if(rc) this.receives = JSON.parse(rc); else this.receives = [];
        },
        initProducts() {
            this.products = productBase.map(item => ({
                itemcode: item[0], description: item[1], unit: item[2], 
                price: (item[3] !== "" && !isNaN(parseFloat(item[3]))) ? parseFloat(item[3]) : 0,
                quantity: Math.floor(Math.random() * 30) + 15, reorderPoint: 10
            }));
            if(this.products.length > 0) {
                this.products[0].quantity = 5;
                for(let i = 1; i < this.products.length; i++) {
                    this.products[i].quantity = Math.floor(Math.random() * 30) + 15;
                }
            }
            this.save();
        },
        save() { 
            localStorage.setItem("uniform_products_v9", JSON.stringify(this.products)); 
            localStorage.setItem("uniform_movements_v9", JSON.stringify(this.movements)); 
            localStorage.setItem("uniform_returns_v9", JSON.stringify(this.returns)); 
            localStorage.setItem("uniform_receives_v9", JSON.stringify(this.receives)); 
        }
    };
    AppStore.load();
    
    const Helper = {
        formatDateThai(dateStr) { if(!dateStr) return "-"; let p = dateStr.split('-'); if(p.length===3) return `${p[2]}/${p[1]}/${parseInt(p[0])+543}`; return dateStr; },
        currentDate() { return new Date().toISOString().slice(0,10); },
        timestamp() { return new Date().toLocaleString('th-TH'); },
        updateStats() {
            const products = AppStore.products;
            const total = products.length;
            const normalCount = products.filter(p => p.quantity > (p.reorderPoint || 10)).length;
            const lowCount = products.filter(p => p.quantity <= (p.reorderPoint || 10)).length;
            document.getElementById("totalItemsStat").innerHTML = total;
            document.getElementById("normalStockStat").innerHTML = normalCount;
            document.getElementById("lowStockStat").innerHTML = lowCount;
        }
    };
    
    const StockPage = {
        render() { return `
            <div class="card-custom">
                <div class="card-header-custom">
                    <h3><i class="fas fa-boxes"></i> คลังสินค้าเครื่องแบบ</h3>
                </div>
                <div class="card-body-custom">
                    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
                        <div class="search-box">
                            <i class="fas fa-search text-muted"></i>
                            <input type="text" id="stockSearch" placeholder="ค้นหารหัสหรือชื่อสินค้า...">
                        </div>
                        <small class="text-muted"><i class="fas fa-edit"></i> คลิกดินสอแก้ไขสต็อก</small>
                    </div>
                    <div class="table-wrapper">
                        <table class="table-custom">
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>Itemcode</th>
                                    <th>รายละเอียด</th>
                                    <th>หน่วย</th>
                                    <th>ราคา</th>
                                    <th>คงเหลือ</th>
                                    <th>สถานะ</th>
                                    <th>📦 รีไทม์</th>
                                    <th>จัดการ</th>
                                </tr>
                            </thead>
                            <tbody id="stockTbody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        `; },
        mount() { this.renderTable(); document.getElementById("stockSearch")?.addEventListener("input", e => this.renderTable(e.target.value)); },
        renderTable(filter = "") {
            let data = AppStore.products.filter(p => p.itemcode.includes(filter) || p.description.toLowerCase().includes(filter.toLowerCase()));
            let tbody = document.getElementById("stockTbody");
            if(!tbody) return;
            if(data.length === 0) { tbody.innerHTML = "<tr><td colspan='9' class='text-center py-5'>ไม่พบสินค้า</td></tr>"; return; }
            let html = "";
            data.forEach((p, i) => {
                let reorder = p.reorderPoint ?? 10;
                let need = p.quantity <= reorder;
                let status = need ? '<span class="badge-low">⚠️ ควรสั่งซื้อ</span>' : '<span class="badge-normal">✅ ปกติ</span>';
                html += `<tr>
                    <td style="text-align:center">${i+1}</td>
                    <td style="font-family:monospace">${p.itemcode}</td>
                    <td style="max-width:220px; word-break:break-word;">${p.description}</td>
                    <td style="text-align:center">${p.unit}</td>
                    <td style="text-align:right">${p.price.toFixed(2)}</td>
                    <td style="font-weight:600; ${need ? 'color:#b45309' : ''}; text-align:center">${p.quantity}</td>
                    <td style="text-align:center">${status}</td>
                    <td style="text-align:center"><span class="reorder-val" data-code="${p.itemcode}">🔔 ${reorder}</span></td>
                    <td style="text-align:center"><i class="fas fa-edit edit-stock" data-code="${p.itemcode}"></i></td>
                </tr>`;
            });
            tbody.innerHTML = html;
            document.querySelectorAll(".edit-stock").forEach(btn => btn.addEventListener("click", () => {
                let code = btn.dataset.code; let prod = AppStore.products.find(p => p.itemcode === code);
                let newQty = prompt("ปรับจำนวนสต็อก:", prod.quantity);
                if(newQty && !isNaN(parseInt(newQty))) { prod.quantity = parseInt(newQty); AppStore.save(); this.renderTable(document.getElementById("stockSearch")?.value || ""); Helper.updateStats(); }
            }));
            document.querySelectorAll(".reorder-val").forEach(el => el.addEventListener("click", () => {
                let code = el.dataset.code; let prod = AppStore.products.find(p => p.itemcode === code);
                let newVal = prompt("กำหนดจุดสั่งซื้อ (จำนวนขั้นต่ำ):", prod.reorderPoint);
                if(newVal && !isNaN(parseInt(newVal))) { prod.reorderPoint = parseInt(newVal); AppStore.save(); this.renderTable(document.getElementById("stockSearch")?.value || ""); Helper.updateStats(); }
            }));
        }
    };
    
    // Movement Page (ย่อแต่ใช้งานได้)
    const MovementPage = {
        selectedProduct: null, selectedDept: "", departments: ["PA","SCM","DC","AC","PC","GA","HR","TM","PS","RC","OVEN","QC","SS","RK","ND"],
        render() { return `<div class="card-custom"><div class="card-header-custom"><h3><i class="fas fa-hand-holding-heart"></i> เบิก/แจกพนักงาน</h3></div><div class="card-body-custom"><p class="text-muted text-center p-4">📋 ระบบเบิกจ่ายสินค้า (กำลังพัฒนาในเวอร์ชันถัดไป)</p></div></div>`; },
        mount() {}
    };
    
    const ReturnPage = { render() { return `<div class="card-custom"><div class="card-header-custom"><h3><i class="fas fa-undo-alt"></i> คืน/เปลี่ยนสินค้า</h3></div><div class="card-body-custom text-center p-5"><i class="fas fa-tools fa-3x text-muted mb-3"></i><p>ฟังก์ชันคืนและเปลี่ยนสินค้า (กำลังพัฒนา)</p></div></div>`; }, mount() {} };
    const ReceivePage = { render() { return `<div class="card-custom"><div class="card-header-custom"><h3><i class="fas fa-truck-ramp-box"></i> รับสินค้าเข้า</h3></div><div class="card-body-custom text-center p-5"><i class="fas fa-box-open fa-3x text-muted mb-3"></i><p>ฟังก์ชันรับสินค้าเข้า (กำลังพัฒนา)</p></div></div>`; }, mount() {} };
    const ReportsPage = { render() { let total = AppStore.movements.reduce((s,m)=>s+(m.totalValue||0),0).toFixed(2); return `<div class="card-custom"><div class="card-header-custom"><h3><i class="fas fa-chart-line"></i> รายงานรายเดือน</h3></div><div class="card-body-custom text-center p-5"><i class="fas fa-chart-simple fa-3x text-success mb-3"></i><h4>ยอดรวมเบิกจ่ายทั้งหมด</h4><h2 class="text-primary">${total} บาท</h2><p class="text-muted">ระบบจะแสดงรายละเอียดรายเดือนในเวอร์ชันถัดไป</p></div></div>`; }, mount() {} };
    
    function loadPage(pageId) {
        document.querySelectorAll(".menu-item").forEach(item => item.classList.remove("active"));
        document.querySelector(`.menu-item[data-page="${pageId}"]`)?.classList.add("active");
        const container = document.getElementById("pageContainer");
        if(pageId === "stock") { container.innerHTML = StockPage.render(); StockPage.mount(); }
        else if(pageId === "movement") { container.innerHTML = MovementPage.render(); MovementPage.mount(); }
        else if(pageId === "return") { container.innerHTML = ReturnPage.render(); ReturnPage.mount(); }
        else if(pageId === "receive") { container.innerHTML = ReceivePage.render(); ReceivePage.mount(); }
        else if(pageId === "reports") { container.innerHTML = ReportsPage.render(); ReportsPage.mount(); }
        Helper.updateStats();
    }
    
    function openDrawer() { document.getElementById("sidebar").classList.add("open"); document.getElementById("drawerBackdrop").classList.add("open"); }
    function closeDrawer() { document.getElementById("sidebar").classList.remove("open"); document.getElementById("drawerBackdrop").classList.remove("open"); }
    document.getElementById("menuToggleBtn").addEventListener("click", openDrawer);
    document.getElementById("closeDrawerBtn").addEventListener("click", closeDrawer);
    document.getElementById("drawerBackdrop").addEventListener("click", closeDrawer);
    document.querySelectorAll(".menu-item").forEach(btn => { btn.addEventListener("click", () => { let page = btn.dataset.page; if(page) loadPage(page); closeDrawer(); }); });
    
    loadPage("stock");
    Helper.updateStats();
</script>
</body>
</html>
